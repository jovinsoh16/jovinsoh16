name: generate breakout svg

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate-svg:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # Mencegah Error 403 saat git push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: generate SVG
        uses: cyprieng/github-breakout@v1
        with:
          github_username: ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update breakout SVGs"
          file_pattern: "breakout-images/*.svg"
