name: generate breakout svg

on:
  schedule:
    - cron: "0 */24 * * *"   # jalan tiap hari
  workflow_dispatch:          # bisa dijalankan manual

jobs:
  generate-svg:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: generate SVG
        uses: cyprieng/github-breakout@v1
        with:
          github_username: ${{ github.repository_owner }}
          # opsional:
          # enable_ghost_bricks: false
          # paddle_color: "#ff0000"
          # ball_color: "#00ff00"
          # bricks_colors: "#ffcc00,#00ccff,#cc00ff"

      - name: Commit & Push SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update breakout SVGs"
          file_pattern: "breakout-images/*.svg"

