name: generate breakout svg

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate-svg:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # <-- TAMBAHKAN IZIN INI SUPAYA NGGAK ERROR 403

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Contribution Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            breakout-images/breakout-dark.svg?palette=github-dark
            breakout-images/breakout-light.svg?palette=github-light
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update breakout SVGs"
          file_pattern: "breakout-images/*.svg"
